<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RS CLUB MANAGER V7.1</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f1722;
color:white;
}

header{

height:70px;

background:#182231;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 15px;

}

#menuButton{

width:45px;

height:45px;

border:none;

border-radius:10px;

background:#243447;

color:white;

font-size:22px;

}

#overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.5);

display:none;

z-index:998;

}

#overlay.open{

display:block;

}

#sideMenu{

position:fixed;

top:0;

left:-300px;

width:280px;

height:100vh;

background:#182231;

transition:.3s;

z-index:999;

padding:20px;

}

#sideMenu.open{

left:0;

}

.menuItem{

width:100%;

padding:15px;

margin-top:10px;

background:#243447;

border:none;

border-radius:12px;

color:white;

font-size:16px;

text-align:left;

}

.page{

display:none;

padding:20px;

}

.page.active{

display:block;

}
.hero{

background:#182231;

border-radius:20px;

padding:25px;

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:25px;

}

.heroLeft{

flex:1;

}

.badge{

display:inline-block;

padding:8px 16px;

background:#FFD600;

color:#111;

border-radius:30px;

font-weight:bold;

margin-bottom:20px;

}

.hero h1{

font-size:34px;

margin:8px 0;

}

.hero h2{

font-size:28px;

color:#FFD600;

margin:8px 0;

}

.hero p{

margin-top:10px;

color:#aeb9c8;

}

.primaryButton{

margin-top:20px;

padding:14px 28px;

background:#FFD600;

color:#111;

border:none;

border-radius:14px;

font-weight:bold;

font-size:16px;

}

.heroRight{

display:flex;

align-items:center;

gap:20px;

}

.shield{

width:110px;

height:110px;

border-radius:50%;

background:#243447;

display:flex;

justify-content:center;

align-items:center;

font-size:34px;

font-weight:bold;

}

.vs{

font-size:32px;

font-weight:bold;

color:#FFD600;

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}

.card{

background:#182231;

border-radius:20px;

padding:20px;

min-height:150px;

}

.card h3{

margin-bottom:15px;

}
@media(max-width:900px){

.hero{

flex-direction:column;

text-align:center;

}

.heroRight{

margin-top:20px;

}

.cards{

grid-template-columns:1fr;

}

}
</style>

</head>

<body>

<div id="overlay"></div>

<div id="sideMenu">

<h2>RS CLUB</h2>

<button class="menuItem" data-page="home">🏠 Inicio</button>

<button class="menuItem" data-page="players">👥 Plantilla</button>

<button class="menuItem" data-page="matches">⚽ Partidos</button>

<button class="menuItem" data-page="table">🏆 Clasificación</button>

<button class="menuItem" data-page="admin">⚙ Administración</button>

</div>

<header>

<button id="menuButton">☰</button>

<h2>CADETE S15</h2>

<div></div>

</header>

<div id="page-home" class="page active">

<div class="hero">

<div class="heroLeft">

<div class="badge">

PRÓXIMO PARTIDO

</div>

<h1>Ramón Sicart</h1>

<h2>VS</h2>

<h1>FC Barcelona</h1>

<p>

📅 Domingo 13 Septiembre

</p>

<p>

🕕 18:30

</p>

<p>

📍 Municipal Llorenç

</p>

<button class="primaryButton">

VER PARTIDO

</button>

</div>

<div class="heroRight">

<div class="shield">

RS

</div>

<div class="vs">

VS

</div>

<div class="shield">

FCB

</div>

</div>

</div>

<div class="cards">

<div class="card">

<h3>🏆 Clasificación</h3>

<p>Sin datos</p>

</div>

<div class="card">

<h3>⚽ Goleadores</h3>

<p>Sin datos</p>

</div>

<div class="card">

<h3>📅 Último partido</h3>

<p>Sin datos</p>

</div>

<div class="card">

<h3>📊 Estadísticas</h3>

<p>Sin datos</p>

</div>

</div>

</div>

<div id="page-players" class="page">

<h1>Plantilla</h1>

</div>

<div id="page-matches" class="page">

<h1>Partidos</h1>

</div>

<div id="page-table" class="page">

<h1>Clasificación</h1>

</div>

<div id="page-admin" class="page">

<h1>Administración</h1>

</div>

<script>

const menu=document.getElementById("sideMenu");
const overlay=document.getElementById("overlay");

document.getElementById("menuButton").onclick=()=>{

menu.classList.add("open");
overlay.classList.add("open");

};

overlay.onclick=()=>{

menu.classList.remove("open");
overlay.classList.remove("open");

};

document.querySelectorAll(".menuItem").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".page").forEach(p=>{

p.classList.remove("active");

});

document.getElementById("page-"+btn.dataset.page).classList.add("active");

menu.classList.remove("open");

overlay.classList.remove("open");

};

});

</script>

</body>
</html>
